[project]
name = "pumble_keys_sdk"
version = "0.1.0"
description = "Unofficial Python SDK for the Pumble API Keys addon"
authors = [{ name = "apet97" },]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpcore >=1.0.9",
    "httpx >=0.28.1",
    "jsonpath-python >=1.0.6",
    "mcp[cli] ==2.0.0",
    "pydantic >=2.11.2",
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/apet97/pumble-python-sdk"
Repository = "https://github.com/apet97/pumble-python-sdk"
Issues = "https://github.com/apet97/pumble-python-sdk/issues"
Changelog = "https://github.com/apet97/pumble-python-sdk/blob/main/CHANGELOG.md"


[project.optional-dependencies]
socket = [
    "websockets >=13.0",
]

[project.scripts]
pumble-keys = "pumble_keys.cli.main:main"
pumble-keys-mcp = "pumble_keys.mcp_server.cli:main"

[dependency-groups]
dev = [
    "build >=1.2",
    "coverage >=7.6",
    "mypy ==1.15.0",
    "pip-audit >=2.7",
    "pylint ==3.2.3",
    "pyright ==1.1.398",
    "pytest >=8.3",
    "pytest-asyncio >=1.0",
    "pyyaml >=6.0",
    "respx >=0.22",
    "ruff >=0.12",
    "twine >=6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"pumble_keys.knowledge" = ["*.md", "guides/*.md"]
"pumble_keys.mcp_server.app_assets" = ["*.html", "*.json"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mypy]
disable_error_code = "misc"
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "typing_inspect"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonpath"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"


