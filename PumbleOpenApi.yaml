                  createdBy: aaaaaaaaaaaaaaaaaaaa0001
                  workspaceId: aaaaaaaaaaaaaaaaaaaa0000
                  workspaceUserIds: [aaaaaaaaaaaaaaaaaaaa0001]
        "403":
          $ref: '#/components/responses/Error403'

  /myInfo:
    get:
      operationId: myInfo
      tags: [Users]
      x-speakeasy-retries: *safeReadRetries
      summary: Get info about the authenticated user
      description: Returns the user record for whichever account owns the API key.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: aaaaaaaaaaaaaaaaaaaa0001
                email: user-1@example.invalid
                name: Example User
                title: ""
                role: OWNER
                status: ACTIVATED
                workspaceId: aaaaaaaaaaaaaaaaaaaa0000
                timeZoneId: Europe/Belgrade
                automaticallyTimeZone: true
                activeUntil: 0
                isAddonBot: false
                isPumbleBot: false
                invitedBy: null
        "403":
          $ref: '#/components/responses/Error403'

  /customStatus:
    post:
      operationId: customStatus
      x-sdk-no-write-retries: true
      tags: [Users]
      summary: Update the custom status of the authenticated user
      description: |
        Sets or clears the user's custom status. **Both** `code` and
        `expiresAt` are required server-side. Pass an `expiresAt` far in the
        future for a "don't auto-clear" effect; pass a past timestamp to
        immediately clear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, expiresAt]
              properties:
                code:
                  type: string
                  pattern: '^:[a-zA-Z0-9_+\-]+:$'
                  description: Emoji code in `:emoji_name:` form.
                  example: ":beach_with_umbrella:"
                status:
                  type: string
                  description: Free-form status text.
                  example: Time off
                expiresAt:
                  type: integer
                  format: int64
                  description: Epoch-ms moment to clear the status (0 = never).
            example:
              code: ":beach_with_umbrella:"
              status: Time off
              expiresAt: 1893456000000
      responses:
        "200":
          description: Status updated.
        "403":
          $ref: '#/components/responses/Error403'
