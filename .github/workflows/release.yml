name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.9"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Refuse unreviewed generation commits
        # A release tag must point at a commit on main (reviewed);
        # generation PRs are never tagged directly.
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag does not point at a reviewed commit on main"; exit 1; }
      - name: Version consistency (tag == project version)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PROJECT" || { echo "tag $TAG != project $PROJECT"; exit 1; }
      - name: Sync (locked)
        run: uv sync --all-extras --dev --locked
      - name: Full offline checks
        run: |
          uv run pytest -q
          uv run python tools/sanitize_fixture.py --check
          uv run python tools/scan_secrets.py --all
          uv run python tools/check_generated_boundaries.py
          uv run python tools/build_app.py --check
      - name: Frontend build + package smoke (build receipts)
        run: |
          npm ci --prefix app
          npm run build --prefix app
          uv run python tools/build_app.py --check
          uv run python tools/pack_smoke.py
      - name: Build artifacts
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [verify]
    # Protected environment gate + PyPI trusted publishing (OIDC).
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.9"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Rebuild deterministically for publication
        run: |
          npm ci --prefix app
          npm run build --prefix app
          uv run python tools/build_app.py --check
          uv build
      - name: Publish via trusted publishing (provenance attached)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
