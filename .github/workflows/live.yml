name: live

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    # Protected environment: secrets require environment approval rules.
    environment: sacrificial-workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.9"
      - name: Sync (locked)
        run: uv sync --all-extras --dev --locked
      - name: Live suite (sacrificial guard enforced in-suite)
        env:
          PUMBLE_LIVE: "1"
          PUMBLE_API_KEY: ${{ secrets.PUMBLE_API_KEY }}
          PUMBLE_LIVE_CHANNEL_ID: ${{ secrets.PUMBLE_LIVE_CHANNEL_ID }}
        run: uv run python tools/run_live.py --profile full --require-cleanup
      - name: Upload receipt (hashed IDs only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-receipt
          path: live_receipt.json
